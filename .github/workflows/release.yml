name: Release

on:
    push:
        tags:
            - 'v*.*.*'

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: write
    packages: write

env:
    REGISTRY: ghcr.io

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Check out repository
              uses: actions/checkout@v5

            - name: Normalize container image name
              id: image
              shell: bash
              run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract application image metadata
              id: app-meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
                  flavor: |
                      latest=auto
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}

            - name: Extract migration image metadata
              id: migrator-meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
                  flavor: |
                      latest=false
                  tags: |
                      type=semver,pattern={{version}},suffix=-migrator
                      type=semver,pattern={{major}}.{{minor}},suffix=-migrator
                      type=raw,value=latest-migrator,enable=${{ !contains(github.ref_name, '-') }}

            - name: Build and push application image
              id: app-build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: runner
                  push: true
                  tags: ${{ steps.app-meta.outputs.tags }}
                  labels: ${{ steps.app-meta.outputs.labels }}
                  cache-from: type=gha,scope=runner
                  cache-to: type=gha,mode=max,scope=runner

            - name: Build and push migration image
              id: migrator-build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  target: migrator
                  push: true
                  tags: ${{ steps.migrator-meta.outputs.tags }}
                  labels: ${{ steps.migrator-meta.outputs.labels }}
                  cache-from: type=gha,scope=migrator
                  cache-to: type=gha,mode=max,scope=migrator

            - name: Create GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  generate_release_notes: true
                  body: |
                      Application image: `${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.app-meta.outputs.version }}`

                      Migration image: `${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.migrator-meta.outputs.version }}`

                      ```sh
                      docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.app-meta.outputs.version }}
                      docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.migrator-meta.outputs.version }}
                      ```

                      Application digest: `${{ steps.app-build.outputs.digest }}`

                      Migration digest: `${{ steps.migrator-build.outputs.digest }}`
